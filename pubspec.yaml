name: mealist_ai
description: "AI Recipe & Meal Planner — Mealist.ai"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # state management
  get: ^4.6.6

  # networking
  dio: ^5.7.0

  # image caching
  cached_network_image: ^3.4.1

  # responsive layout
  flutter_screenutil: ^5.9.3

  # icons
  cupertino_icons: ^1.0.8

  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
